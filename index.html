<!DOCTYPE html>
<html lang="zh-CN">
    
<head>
  <meta charset="UTF-8">
  <title>FocusTV</title>
</head>

<body>
  <h1>FocusTV</h1>

  <main>
    <section class="timer" data-tier="1">
      <h2>学习 / 科研</h2>
      <p class="timer-display">00:00:00</p>
      <div class="timer-controls">
        <button class="btn-start">开始</button>
      </div>
    </section>

    <section class="timer" data-tier="2">
      <h2>生活 / 全面发展</h2>
      <p class="timer-display">00:00:00</p>
      <div class="timer-controls">
        <button class="btn-start">开始</button>
      </div>
    </section>

    <section class="timer" data-tier="3">
      <h2>放空 / 休息</h2>
      <p class="timer-display">00:00:00</p>
      <div class="timer-controls">
        <button class="btn-start">开始</button>
      </div>
    </section>
  </main>

  <footer>
    <button id="btn-sleep">睡眠</button>
  </footer>
</body>

</html>
