<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>FocusTV</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>
</head>

<body>
  <h1>FocusTV</h1>

  <main>
    <section class="timer" data-tier="1">
      <h2>学习 / 科研</h2>
      <p class="timer-display">00:00:00</p>
      <div class="timer-controls">
        <button class="btn-start">开始</button>
      </div>
    </section>

    <section class="timer" data-tier="2">
      <h2>生活 / 全面发展</h2>
      <p class="timer-display">00:00:00</p>
      <div class="timer-controls">
        <button class="btn-start">开始</button>
      </div>
    </section>

    <section class="timer" data-tier="3">
      <h2>放空 / 休息</h2>
      <p class="timer-display">00:00:00</p>
      <div class="timer-controls">
        <button class="btn-start">开始</button>
      </div>
    </section>
  </main>

    <!-- 【10.15 新增：今日记录】放在原来的 </main> 后、<footer> 前。 -->
  <section class="today-records" aria-labelledby="today-records-title">
    <h2 id="today-records-title">今日记录</h2>
    <p id="records-message" role="status">今天还没有记录，完成一次计时后会显示在这里。</p>

    <!-- 没有记录时隐藏表格；有记录时由 JS 显示。 -->
    <div id="records-table-wrapper" class="records-table-wrapper" hidden>
      <table>
        <thead>
          <tr>
            <th scope="col">档位</th>
            <th scope="col">开始时间</th>
            <th scope="col">累计计时时长</th>
          </tr>
        </thead>
        <!-- JS 把每条今天的记录添加成一行。 -->
        <tbody id="today-records-body"></tbody>
      </table>
    </div>
  </section>
  <!-- 【10.15 新增：今日记录结束】 -->

  <footer>
    <button id="btn-sleep">睡眠</button>
  </footer>

  <!--手动把链接.js放在<body>部分最末尾可以避免html还未加载好就试图用js操作。
  更稳妥的方法则是在.js里面直接设置等待收到html加载好信号再执行。
  <script src="script.js"></script>
  -->
</body>

</html>
